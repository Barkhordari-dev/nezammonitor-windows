name: Build and Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore src/NezamMonitor.sln
    
    - name: Build
      run: dotnet build src/NezamMonitor.sln -c Release --no-restore
    
    - name: Publish (self-contained single-file — نیاز به نصب .NET ندارد)
      run: dotnet publish src/NezamMonitor.App/NezamMonitor.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o publish/

    - name: Prepare release package (only runtime files)
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        if (Test-Path "src/templates") { Copy-Item "src/templates" "publish/templates" -Recurse -Force }
        elseif (Test-Path "release/templates") { Copy-Item "release/templates" "publish/templates" -Recurse -Force }
        Get-ChildItem publish | Format-Table Name, Length
        $exe = Get-ChildItem publish/*.exe | Select-Object -First 1
        Write-Host "EXE size MB: $([math]::Round($exe.Length/1MB,1))"
        # ZIP کم‌حجم برای دانلود (exe + templates) — نام انگلیسی برای پرهیز از باگ آپلود فارسی
        Compress-Archive -Path publish/* -DestinationPath "publish/NezamMonitor-Windows.zip" -Force
        Get-Item "publish/NezamMonitor-Windows.zip" | Format-Table Name, Length

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: NezamMonitor-Windows
        path: publish/
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          publish/*.exe
          publish/NezamMonitor-Windows.zip
        draft: false
        prerelease: false
        generate_release_notes: true
